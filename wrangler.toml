# wrangler.toml
name = "my-workspace"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[vars]
APP_ENV      = "production"
GITHUB_OWNER = "prhdev222"
GITHUB_REPO  = "obsidian_workspace"

# Add in Cloudflare Dashboard → Settings → Environment Variables (encrypted):
# TURSO_URL      = "libsql://your-db-name.turso.io"
# TURSO_TOKEN    = "your-turso-auth-token"
# SESSION_SECRET = "a-long-random-string-min-32-chars"
# GITHUB_TOKEN   = "your-github-personal-access-token"

[[r2_buckets]]
binding = "R2"
bucket_name = "workspace-attachments"
